<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WITS User Management</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .search-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-panel input,
    .search-panel select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .search-panel input {
      flex: 1;
      min-width: 150px;
    }

    .search-panel button {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .search-panel button:hover {
      background: #0056b3;
    }

    .search-panel button.secondary {
      background: #6c757d;
    }

    .search-panel button.secondary:hover {
      background: #545b62;
    }

    .toolbar {
      margin-bottom: 20px;
    }

    .toolbar button {
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .toolbar button:hover {
      background: #218838;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .loading.show {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #333;
    }

    tbody tr:hover {
      background: #f9f9f9;
    }

    .actions button {
      margin-right: 5px;
      padding: 6px 12px;
      font-size: 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .edit-btn {
      background: #17a2b8;
      color: white;
    }

    .edit-btn:hover {
      background: #138496;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    .pagination {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }

    .pagination button {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination button:hover {
      background: #0056b3;
    }

    .pagination button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .pagination-info {
      color: #666;
      font-size: 14px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #333;
    }

    .modal h3 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
    }

    .error-message {
      color: #dc3545;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .form-group.error input,
    .form-group.error select {
      border-color: #dc3545;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      justify-content: flex-end;
    }

    .modal-footer button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .modal-footer .btn-primary {
      background: #007bff;
      color: white;
    }

    .modal-footer .btn-primary:hover {
      background: #0056b3;
    }

    .modal-footer .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .modal-footer .btn-secondary:hover {
      background: #545b62;
    }

    .modal-footer .btn-danger {
      background: #dc3545;
      color: white;
    }

    .modal-footer .btn-danger:hover {
      background: #c82333;
    }

    .toast {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #28a745;
      color: white;
      padding: 15px 20px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 2000;
      animation: slideIn 0.3s ease;
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      background: #dc3545;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
      }
      to {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WITS User Management</h1>

    <!-- Search Area -->
    <div class="search-panel">
      <input
        type="text"
        id="search-name"
        placeholder="Search Name"
        data-testid="search-name" />

      <select id="status-filter" data-testid="status-filter">
        <option value="">All Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>

      <button id="search-btn" data-testid="search-btn">Search</button>
      <button id="reset-btn" class="secondary" data-testid="reset-btn">Reset</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="add-user-btn" data-testid="add-user-btn">Add User</button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading-spinner" data-testid="loading-spinner">Loading...</div>

    <!-- User Table -->
    <table data-testid="user-table">
      <thead>
        <tr>
          <th data-testid="sort-id">ID</th>
          <th data-testid="sort-name">Name</th>
          <th data-testid="sort-email">Email</th>
          <th data-testid="sort-role">Role</th>
          <th data-testid="sort-status">Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="user-table-body" data-testid="user-table-body">
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
      <button id="prev-page-btn" data-testid="previous-page-btn">Previous</button>
      <span id="page-info" class="pagination-info" data-testid="page-number">Page 1 of 1</span>
      <button id="next-page-btn" data-testid="next-page-btn">Next</button>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="user-modal" data-testid="user-modal">
    <div class="modal-content">
      <h2 id="modal-title" data-testid="modal-title">Add User</h2>

      <div class="form-group">
        <label for="user-name-input">Name</label>
        <input type="text" id="user-name-input" data-testid="user-name-input" placeholder="Full name" />
        <div class="error-message" id="error-name">Name is required</div>
      </div>

      <div class="form-group">
        <label for="user-email-input">Email</label>
        <input type="email" id="user-email-input" data-testid="user-email-input" placeholder="user@example.com" />
        <div class="error-message" id="error-email">Email is required</div>
      </div>

      <div class="form-group">
        <label for="user-role-select">Role</label>
        <select id="user-role-select" data-testid="user-role-select">
          <option value="">Please select</option>
          <option value="QA">QA</option>
          <option value="SDET">SDET</option>
          <option value="Developer">Developer</option>
          <option value="Manager">Manager</option>
        </select>
        <div class="error-message" id="error-role">Role is required</div>
      </div>

      <div class="form-group">
        <label for="user-status-select">Status</label>
        <select id="user-status-select" data-testid="user-status-select">
          <option value="">Please select</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
        <div class="error-message" id="error-status">Status is required</div>
      </div>

      <div class="modal-footer">
        <button id="save-user-btn" class="btn-primary" data-testid="save-user-btn">Save</button>
        <button id="cancel-user-btn" class="btn-secondary" data-testid="cancel-user-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal" id="delete-confirm-modal" data-testid="delete-confirm-modal">
    <div class="modal-content">
      <h3>Are you sure you want to delete this user?</h3>
      <div class="modal-footer">
        <button id="confirm-delete-btn" class="btn-danger" data-testid="confirm-delete-btn">Delete</button>
        <button id="cancel-delete-btn" class="btn-secondary" data-testid="cancel-delete-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast-message" data-testid="toast-message"></div>

  <script>
    const API_BASE = '/api/users';
    const PAGE_SIZE = 10;

    let currentPage = 1;
    let currentSearchName = '';
    let currentSearchStatus = '';
    let totalRecords = 0;
    let editingUserId = null;
    let deletingUserId = null;

    const searchNameInput = document.getElementById('search-name');
    const statusFilter = document.getElementById('status-filter');
    const searchBtn = document.getElementById('search-btn');
    const resetBtn = document.getElementById('reset-btn');
    const addUserBtn = document.getElementById('add-user-btn');
    const userTableBody = document.getElementById('user-table-body');
    const loadingSpinner = document.getElementById('loading-spinner');
    const prevPageBtn = document.getElementById('prev-page-btn');
    const nextPageBtn = document.getElementById('next-page-btn');
    const pageInfo = document.getElementById('page-info');
    const userModal = document.getElementById('user-modal');
    const deleteConfirmModal = document.getElementById('delete-confirm-modal');
    const modalTitle = document.getElementById('modal-title');
    const userNameInput = document.getElementById('user-name-input');
    const userEmailInput = document.getElementById('user-email-input');
    const userRoleSelect = document.getElementById('user-role-select');
    const userStatusSelect = document.getElementById('user-status-select');
    const saveUserBtn = document.getElementById('save-user-btn');
    const cancelUserBtn = document.getElementById('cancel-user-btn');
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
    const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
    const toastMessage = document.getElementById('toast-message');

    function showToast(message, isError = false) {
      toastMessage.textContent = message;
      toastMessage.classList.add('show');
      if (isError) {
        toastMessage.classList.add('error');
      } else {
        toastMessage.classList.remove('error');
      }
      setTimeout(() => {
        toastMessage.classList.remove('show');
      }, 3000);
    }

    function showLoading(show = true) {
      loadingSpinner.classList.toggle('show', show);
    }

    function clearFormErrors() {
      document.querySelectorAll('.form-group').forEach(group => group.classList.remove('error'));
      document.querySelectorAll('.error-message').forEach(msg => msg.classList.remove('show'));
    }

    function validateForm() {
      clearFormErrors();
      let hasErrors = false;

      if (!userNameInput.value.trim()) {
        userNameInput.parentElement.classList.add('error');
        document.getElementById('error-name').classList.add('show');
        hasErrors = true;
      }

      if (!userEmailInput.value.trim()) {
        userEmailInput.parentElement.classList.add('error');
        document.getElementById('error-email').classList.add('show');
        hasErrors = true;
      }

      if (!userRoleSelect.value) {
        userRoleSelect.parentElement.classList.add('error');
        document.getElementById('error-role').classList.add('show');
        hasErrors = true;
      }

      if (!userStatusSelect.value) {
        userStatusSelect.parentElement.classList.add('error');
        document.getElementById('error-status').classList.add('show');
        hasErrors = true;
      }

      return !hasErrors;
    }

    function openAddUserModal() {
      editingUserId = null;
      clearFormErrors();
      modalTitle.textContent = 'Add User';
      userNameInput.value = '';
      userEmailInput.value = '';
      userRoleSelect.value = '';
      userStatusSelect.value = '';
      userModal.classList.add('show');
    }

    function openEditUserModal(user) {
      editingUserId = user.id;
      clearFormErrors();
      modalTitle.textContent = 'Edit User';
      userNameInput.value = user.name;
      userEmailInput.value = user.email;
      userRoleSelect.value = user.role;
      userStatusSelect.value = user.status;
      userModal.classList.add('show');
    }

    function closeUserModal() {
      userModal.classList.remove('show');
      clearFormErrors();
    }

    function openDeleteConfirmation(userId) {
      deletingUserId = userId;
      deleteConfirmModal.classList.add('show');
    }

    function closeDeleteConfirmation() {
      deleteConfirmModal.classList.remove('show');
      deletingUserId = null;
    }

    async function fetchUsers(page = 1, name = '', status = '') {
      showLoading(true);
      try {
        const offset = (page - 1) * PAGE_SIZE;
        const params = new URLSearchParams({
          offset,
          limit: PAGE_SIZE
        });
        if (name) params.append('name', name);
        if (status) params.append('status', status);

        const response = await fetch(`${API_BASE}?${params}`, {
          method: 'GET'
        });

        if (!response.ok) {
          throw new Error('Failed to fetch users');
        }

        const data = await response.json();
        totalRecords = data.total || 0;
        currentPage = page;
        renderUsers(data.users || []);
        updatePagination();
      } catch (error) {
        showToast('Error loading users: ' + error.message, true);
      } finally {
        showLoading(false);
      }
    }

    function renderUsers(users) {
      userTableBody.innerHTML = '';
      if (users.length === 0) {
        userTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">No users found</td></tr>';
        return;
      }

      users.forEach(user => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.role}</td>
          <td>${user.status}</td>
          <td>
            <button class="edit-btn" data-testid="edit-user-btn-${user.id}" onclick="openEditUserModal(${JSON.stringify(user).replace(/"/g, '&quot;')})">Edit</button>
            <button class="delete-btn" data-testid="delete-user-btn-${user.id}" onclick="openDeleteConfirmation(${user.id})">Delete</button>
          </td>
        `;
        userTableBody.appendChild(row);
      });
    }

    function updatePagination() {
      const maxPages = Math.ceil(totalRecords / PAGE_SIZE) || 1;
      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= maxPages;
      pageInfo.textContent = `Page ${currentPage} of ${maxPages}`;
    }

    async function saveUser() {
      if (!validateForm()) return;

      const userData = {
        name: userNameInput.value.trim(),
        email: userEmailInput.value.trim(),
        role: userRoleSelect.value,
        status: userStatusSelect.value
      };

      try {
        let response;
        if (editingUserId) {
          response = await fetch(`${API_BASE}/${editingUserId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          });
        } else {
          response = await fetch(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          });
        }

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || 'Failed to save user');
        }

        closeUserModal();
        showToast(editingUserId ? 'User updated successfully' : 'User added successfully');
        fetchUsers(currentPage, currentSearchName, currentSearchStatus);
      } catch (error) {
        showToast('Error: ' + error.message, true);
      }
    }

    async function deleteUser() {
      if (!deletingUserId) return;

      try {
        const response = await fetch(`${API_BASE}/${deletingUserId}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || 'Failed to delete user');
        }

        closeDeleteConfirmation();
        showToast('User deleted successfully');
        fetchUsers(currentPage, currentSearchName, currentSearchStatus);
      } catch (error) {
        showToast('Error: ' + error.message, true);
      }
    }

    searchBtn.addEventListener('click', () => {
      currentSearchName = searchNameInput.value.trim();
      currentSearchStatus = statusFilter.value;
      currentPage = 1;
      fetchUsers(1, currentSearchName, currentSearchStatus);
    });

    resetBtn.addEventListener('click', () => {
      searchNameInput.value = '';
      statusFilter.value = '';
      currentSearchName = '';
      currentSearchStatus = '';
      currentPage = 1;
      fetchUsers(1);
    });

    addUserBtn.addEventListener('click', openAddUserModal);
    cancelUserBtn.addEventListener('click', closeUserModal);
    saveUserBtn.addEventListener('click', saveUser);

    cancelDeleteBtn.addEventListener('click', closeDeleteConfirmation);
    confirmDeleteBtn.addEventListener('click', deleteUser);

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        fetchUsers(currentPage - 1, currentSearchName, currentSearchStatus);
      }
    });

    nextPageBtn.addEventListener('click', () => {
      const maxPages = Math.ceil(totalRecords / PAGE_SIZE) || 1;
      if (currentPage < maxPages) {
        fetchUsers(currentPage + 1, currentSearchName, currentSearchStatus);
      }
    });

    userModal.addEventListener('click', (e) => {
      if (e.target === userModal) closeUserModal();
    });

    deleteConfirmModal.addEventListener('click', (e) => {
      if (e.target === deleteConfirmModal) closeDeleteConfirmation();
    });

    fetchUsers(1);
  </script>
</body>
</html>
